*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 'Inter',system-ui,sans-serif}
h1,h2,h3{font-family:'Cinzel',Georgia,serif;letter-spacing:.03em}button,input,select,th,.k{font-family:'Inter',system-ui,sans-serif}header h1{color:#e4bd6a;font-size:26px;letter-spacing:.14em}
header{padding:20px max(16px,calc((100% - 1100px)/2)) 22px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;background:linear-gradient(135deg,#0d0d0d,#2b1d0e);color:#fff7e6;border-bottom:3px solid #d4a84b}header label{color:#f0d9b0}header input{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.25);color:#fff}header .gh{color:#fff;border-color:rgba(255,255,255,.35)}.logo{display:flex;align-items:center;gap:12px}.lg{width:62px;height:62px;border-radius:50%;object-fit:cover;background:#f6f1e7;border:2px solid #d4a84b}.logo small{display:block;font:12px 'Inter',system-ui;color:#f0d9b0}
h1{font-size:22px;margin:0;font-weight:700}
nav{display:flex;gap:4px;flex-wrap:wrap;background:var(--card);border-bottom:1px solid var(--line);padding:0 max(16px,calc((100% - 1100px)/2));position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
nav button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px;font-size:14px;color:var(--mut);cursor:pointer}
nav button.on{color:var(--ink);border-color:var(--acc);font-weight:600}
main{max-width:1100px;margin:auto;padding:16px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;box-shadow:0 1px 3px rgba(60,40,10,.08)}.ic{font-size:18px;margin-right:6px}.stack{height:22px;border-radius:11px;overflow:hidden;display:flex;margin:10px 0}.stack i{display:block;height:100%}.leg{display:flex;flex-wrap:wrap;gap:6px 16px;font:12px 'Inter',system-ui}.leg span::before{content:'';display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--c);margin-right:5px}.cols{display:flex;align-items:flex-end;gap:10px;height:140px;margin-bottom:14px}.col{flex:1;max-width:60px;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;font:11px 'Inter',system-ui;color:var(--mut)}.col i{width:100%;background:var(--acc);border-radius:5px 5px 0 0;min-height:3px}header h1{font-weight:700}.si{width:1.1em;height:1.1em;vertical-align:-.2em;margin-right:5px;flex:none}.gh .si{margin:0 3px 0 0}.ic .si{width:1.2em;height:1.2em;margin:0;color:var(--acc)}.pl{display:inline-block;padding:3px 11px;border-radius:12px;font:600 12px 'Inter',system-ui,sans-serif}.gh.on{outline:2px solid var(--acc);outline-offset:1px}nav button .si{margin-right:6px}.ck{flex-direction:row;align-items:center;min-width:0;flex:none;font-size:13px;color:var(--ink);gap:6px}.ck input{width:auto}.ph h2{font-size:24px;margin:2px 0 2px}.ph p{margin:0 0 16px;color:var(--mut);font-size:13px}footer{text-align:center;color:var(--mut);font:12px/1.6 'Inter',system-ui,sans-serif;padding:26px 16px 34px}
th{background:rgba(138,90,28,.07);text-transform:uppercase;letter-spacing:.04em;font-size:11px}
button{transition:background .15s,filter .15s,box-shadow .15s}.bt:hover{filter:brightness(1.1);box-shadow:0 2px 8px rgba(0,0,0,.2)}.gh:hover{background:rgba(138,90,28,.1)}
.card{transition:box-shadow .2s}.grid .card:hover{box-shadow:0 4px 14px rgba(60,40,10,.14)}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);background:#1b1409;color:#f0d9b0;padding:11px 18px;border-radius:8px;border-left:4px solid #d4a84b;font:500 14px 'Inter',system-ui,sans-serif;opacity:0;pointer-events:none;transition:.25s;z-index:30;max-width:90vw;box-shadow:0 6px 20px rgba(0,0,0,.35)}#toast.show{opacity:1;transform:translate(-50%,0)}
body:not(.in) header,body:not(.in) nav,body:not(.in) main,body:not(.in) footer{display:none}body.in #lg{display:none}
#lg{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:20px;overflow:auto;background:radial-gradient(circle at 15% 20%,#3d2711,transparent 55%),radial-gradient(circle at 85% 85%,#2c1a08,transparent 55%),#0b0907;background-size:150% 150%;animation:bgm 14s ease-in-out infinite alternate;transition:opacity .6s,transform .6s}
#lg.out{opacity:0;transform:scale(1.05);pointer-events:none}@keyframes bgm{to{background-position:100% 100%}}
#cv{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.lbox{position:relative;width:min(380px,100%);margin-top:50px;padding:34px 30px 24px;border-radius:18px;background:rgba(24,18,11,.8);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(212,168,75,.35);box-shadow:0 22px 60px rgba(0,0,0,.6),0 0 44px rgba(212,168,75,.12);text-align:center;color:#f0d9b0;animation:lup .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes lup{from{opacity:0;transform:translateY(30px) scale(.97)}}
.llogo{display:block;width:108px;height:108px;margin:-92px auto 10px;border-radius:50%;object-fit:cover;background:#f6f1e7;border:3px solid #d4a84b;animation:glw 3s ease-in-out infinite}
@keyframes glw{0%,100%{box-shadow:0 0 10px rgba(228,189,106,.3)}50%{box-shadow:0 0 30px rgba(228,189,106,.8)}}
.lbox h1{font-size:30px;letter-spacing:.22em;color:#e4bd6a;margin:6px 0 0}.lsub{margin:2px 0 24px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#a89a85}
#lg .fl{position:relative;display:block;margin-bottom:14px;text-align:left;min-width:0;flex:none;font:inherit;color:inherit}
#lg .fl input{width:100%;padding:21px 46px 8px 14px;background:rgba(255,255,255,.06);border:1px solid rgba(212,168,75,.3);border-radius:10px;color:#fff;font-size:15px;transition:border-color .2s,box-shadow .2s,background .2s}
#lg .fl input:focus{outline:0;border-color:#e4bd6a;background:rgba(255,255,255,.1);box-shadow:0 0 0 3px rgba(228,189,106,.2)}
#lg .fl span{position:absolute;left:14px;top:16px;color:#a89a85;font-size:15px;pointer-events:none;transition:all .18s}
#lg .fl input:focus+span,#lg .fl input:not(:placeholder-shown)+span{top:6px;font-size:11px;color:#e4bd6a}
#lv{position:absolute;right:8px;top:11px;background:none;border:0;color:#a89a85;cursor:pointer;padding:4px;display:grid}#lv:hover{color:#e4bd6a}
#lg .lk{display:flex;flex-direction:row;align-items:center;gap:8px;min-width:0;flex:none;font:13px 'Inter',system-ui,sans-serif;color:#a89a85;margin:2px 0 12px}#lg .lk input{width:auto;accent-color:#d4a84b}
#le{min-height:20px;color:#ff8a80;font-size:13px;margin-bottom:6px}
.lbtn{position:relative;overflow:hidden;width:100%;padding:13px;border:0;border-radius:10px;background:linear-gradient(135deg,#e4bd6a,#b8862b);color:#1b1409;font:700 14px 'Inter',system-ui,sans-serif;letter-spacing:.14em;cursor:pointer;transition:transform .15s,box-shadow .2s}
.lbtn:hover{transform:translateY(-1px);box-shadow:0 8px 22px rgba(228,189,106,.35)}.lbtn:active{transform:translateY(1px)}
.lbtn::after{content:'';position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.5),transparent);transform:skewX(-20deg);animation:shn 3.6s infinite}@keyframes shn{60%,100%{left:140%}}
.lft{margin:16px 0 0;font-size:11px;color:#7a6c5a;letter-spacing:.08em}
.lbox.shake{animation:shk .45s}@keyframes shk{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
@media (prefers-reduced-motion:reduce){#lg,.lbox,.llogo,.lbtn::after{animation:none!important}}
tr:hover td{background:rgba(138,90,28,.06)}
.k{font-size:12px;color:var(--mut)}.v{font-variant-numeric:tabular-nums;font-size:24px;font-weight:700;margin-top:2px}
.pa{border-left:5px solid var(--a)}.pb{border-left:5px solid var(--b)}.pe{border-left:5px solid var(--emp)}
h2{font-size:16px;margin:22px 0 8px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:end;margin-bottom:10px}
label{display:flex;flex-direction:column;font:12px 'Inter',system-ui,sans-serif;color:var(--mut);gap:3px;flex:1;min-width:120px}
input,select{padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);font-size:14px;width:100%}
button.bt{background:var(--acc);color:#fff;border:0;border-radius:6px;padding:9px 14px;font-size:14px;cursor:pointer}
button.gh{background:none;border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:7px 10px;font-size:13px;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:720px}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-size:12px;color:var(--mut)}td.n,th.n{text-align:right}
.tag{padding:2px 7px;border-radius:10px;font:12px 'Inter',system-ui;border:1px solid var(--line)}
.pg{color:var(--a)}.pd{color:var(--bad)}
.bar{height:10px;background:var(--line);border-radius:5px;overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.hide{display:none}
.hint{color:var(--mut);font-size:13px}
</style>
</head>

function calc(v){
 const bruto=v.qtd*v.preco-(+v.desc||0),taxas=bruto*(+v.taxa||0)/100+(+v.frete||0)+(+v.fixo||0)*v.qtd,custo=v.qtd*v.custo,liq=bruto-taxas,lucro=liq-custo;
 const [a,b]=un(v),cA=(+a||0)*v.qtd,cB=(+b||0)*v.qtd;
 return{bruto,taxas,custo,liq,lucro,cA,cB};
}

 const t={bruto:0,taxas:0,custo:0,lucro:0,qtd:0,comA:0,comB:0,pagoA:0,pagoB:0,vA:0,vB:0,nA:0,nB:0,desp:0,ads:0};
 lista().forEach(v=>{const c=calc(v);t.bruto+=c.bruto;t.taxas+=c.taxas;t.custo+=c.custo;t.lucro+=c.lucro;t.qtd+=+v.qtd;t.comA+=c.cA;t.comB+=c.cB;if(v.pA)t.pagoA+=c.cA;if(v.pB)t.pagoB+=c.cB;if(c.cA>0)t.nA++;if(c.cB>0)t.nB++;v.vend==='A'?t.vA+=c.bruto:t.vB+=c.bruto});
 listaC().forEach(c=>t.desp+=+c.valor);Object.values(adDias()).forEach(d=>t.ads+=d.t);
 t.res=t.lucro-t.comA-t.comB-t.ads;return t}

 <h3>Novo produto</h3><div class="row"><label>Nome<input id="p_n"></label><label>Preço padrão (R$)<input id="p_p" type="number" step="0.01"></label><label>Custo (R$)<input id="p_c" type="number" step="0.01"></label><label>${A} recebe (R$)<input id="p_a" type="number" step="0.01"></label><label>${B} recebe (R$)<input id="p_b" type="number" step="0.01"></label><button class="bt" onclick="addP()">Adicionar</button></div></div>`}
function savePE(id){const p=S.prod.find(x=>x.id==id),nm=$('#e_n').value.trim(),pr=+$('#e_pp').value;if(!nm||pr<=0){toast('Informe nome e preço.');return}
 const velho=p.nome;p.nome=nm;p.precos[platSel]=pr;p.custo=+$('#e_c').value||0;p.comA=+$('#e_a').value||0;p.comB=+$('#e_b').value||0;S.ads.forEach(a=>{a.prods=a.prods.map(q=>q===velho?nm:q)});
 if(S.vendas.some(v=>v.prod===velho)&&confirm('Aplicar nome, custo e comissões novos às vendas já registradas deste produto?\n\nOK = recalcula o histórico\nCancelar = mantém o histórico como estava'))S.vendas.forEach(v=>{if(v.prod===velho){v.prod=nm;v.custo=p.custo;v.uA=p.comA;v.uB=p.comB}});
 editP=null;save();prod()}
function addP(){const n=$('#p_n').value.trim(),p=+$('#p_p').value;if(!n||p<=0){toast('Informe nome e preço.');return}S.prod.push({id:nid(S.prod),nome:n,custo:+$('#p_c').value||0,preco:p,precos:{},comA:+$('#p_a').value||0,comB:+$('#p_b').value||0});save();prod()}
const delP=id=>{S.prod=S.prod.filter(x=>x.id!=id);save();prod()};
const nd=a=>{const hj=hoje(),f=a.fim&&a.fim<hj?a.fim:hj;return Math.max(0,Math.round((new Date(f)-new Date(a.ini))/864e5)+1)};
function ads(){const D=adDias(),ks=Object.keys(D).sort().reverse(),hj=hoje(),t=tot();
 const dia_=S.ads.filter(a=>!a.fim).reduce((s,a)=>s+a.valor,0),G={},F={};
 ks.forEach(k=>Object.entries(D[k].p).forEach(([p,v])=>G[p]=(G[p]||0)+v));lista().forEach(v=>F[v.prod]=(F[v.prod]||0)+calc(v).bruto);
 const ps=[...new Set([...Object.keys(G),...Object.keys(F)])],fd=x=>x.split('-').reverse().join('/');
 $('#m').innerHTML=`<div class="grid">${card('Orçamento diário ativo',R(dia_),'','mega')}${card('Gasto no período',R(t.ads),'','down')}${card('Média por dia',R(ks.length?t.ads/ks.length:0),'','cal')}${card('Retorno (faturamento ÷ anúncios)',t.ads?(t.bruto/t.ads).toFixed(1).replace('.',',')+'x':'–','','target')}</div>
 <p class="hint">O valor diário de cada anúncio é lançado automaticamente todo dia, desde a data de início até você pausar. Em anúncios com mais de um produto, o gasto é dividido igualmente entre eles nos relatórios por produto.</p>
 <h2>Anúncios definidos</h2><div class="card"><div class="tw"><table><tr><th>Produto</th><th class="n">Por dia</th><th>Início</th><th>Status</th><th class="n">Gasto total</th><th></th></tr>${S.ads.map(a=>`<tr><td><b>${esc(a.nome||a.prods.join(' + '))}</b><div class="hint">${a.prods.length>1?a.prods.length+' produtos: ':''}${a.prods.map(esc).join(' · ')}</div></td><td class="n">${R(a.valor)}</td><td>${fd(a.ini)}</td><td class="${a.fim?'pd':'pg'}">${a.fim?'Encerrado em '+fd(a.fim):'Ativo'}</td><td class="n">${R(nd(a)*a.valor)}</td><td>${a.fim?'':`<button class="gh" onclick="altA(${a.id})">Alterar valor</button> <button class="gh" onclick="pauA(${a.id})">Pausar</button> `}<button class="gh" onclick="delA(${a.id})" aria-label="Excluir">${I('x')}</button></td></tr>`).join('')||'<tr><td colspan=6 class="hint">Nenhum anúncio ainda. Ative o primeiro abaixo.</td></tr>'}</table></div>
 <h3>Novo anúncio</h3><div class="row"><label style="flex-basis:100%">Nome do anúncio (opcional)<input id="a_n" placeholder="Ex.: Anúncio Tallow 200g + 400g"></label><div style="flex-basis:100%"><div class="k">Produtos deste anúncio (marque um ou mais)</div><div class="row" style="margin:6px 0">${S.prod.map(p=>`<label class="ck"><input type="checkbox" class="a_ck" value="${esc(p.nome)}"> ${esc(p.nome)}</label>`).join('')}</div></div><label>Valor por dia (R$)<input id="a_v" type="number" step="0.01"></label><label>Início<input type="date" id="a_i" value="${hj}"></label><button class="bt" onclick="addA()">Ativar anúncio</button></div></div>
 <h2>Gasto e retorno por produto</h2><div class="card tw"><table><tr><th>Produto</th><th class="n">Gasto</th><th class="n">Faturamento</th><th class="n">Retorno</th></tr>${ps.map(p=>`<tr><td>${esc(p)}</td><td class="n">${R(G[p])}</td><td class="n">${R(F[p])}</td><td class="n">${G[p]?((F[p]||0)/G[p]).toFixed(1).replace('.',',')+'x':'–'}</td></tr>`).join('')||'<tr><td colspan=4 class="hint">Sem dados</td></tr>'}</table></div>
 <h2>Gasto diário</h2><div class="card tw"><table><tr><th>Dia</th><th class="n">Total</th><th>Por produto</th></tr>${ks.map(k=>`<tr><td>${fd(k)}</td><td class="n"><b>${R(D[k].t)}</b></td><td>${Object.entries(D[k].p).map(([p,v])=>esc(p)+': '+R(v)).join(' · ')}</td></tr>`).join('')||'<tr><td colspan=3 class="hint">Sem gastos no período</td></tr>'}</table></div>`}
function addA(){const v=+$('#a_v').value,ps=[...document.querySelectorAll('.a_ck:checked')].map(x=>x.value);if(v<=0||!ps.length||!$('#a_i').value){toast('Marque ao menos um produto e informe o valor diário e a data de início.');return}S.ads.push({id:nid(S.ads),nome:$('#a_n').value.trim(),prods:ps,valor:v,ini:$('#a_i').value,fim:''});save();ads()}
const pauA=id=>{S.ads.find(a=>a.id==id).fim=hoje();save();ads()};
const delA=id=>{if(confirm('Excluir este anúncio e todo o gasto dele?')){S.ads=S.ads.filter(a=>a.id!=id);save();ads()}};
function altA(id){const a=S.ads.find(x=>x.id==id),n=parseFloat(String(prompt('Novo valor por dia (R$):',a.valor)||'').replace(',','.'));if(!(n>0))return;const hj=hoje();
 if(a.ini>=hj)a.valor=n;else{a.fim=dia(hj,-1);S.ads.push({id:nid(S.ads),nome:a.nome,prods:a.prods,valor:n,ini:hj,fim:''})}save();ads()}
function cfg(){const c=S.cfg;
 $('#m').innerHTML=`<div class="card"><h3 style="margin-top:0">Sócios e comissões</h3>
 <div class="row"><label>Seu nome<input id="c_a" value="${esc(c.nomeA)}"></label><label>Nome do sócio<input id="c_b" value="${esc(c.nomeB)}"></label>
 <label>Quem recebe a comissão fixa<select id="c_modo"><option value="ambos">Os dois, em toda venda</option><option value="vendedor">Só quem fez a venda</option></select></label></div>

 <button class="bt" onclick="saveC()">Salvar ajustes</button>
 <p class="hint">Mudar a base ou o percentual recalcula todas as vendas, inclusive as antigas.</p></div>
 <div class="card" style="margin-top:12px"><h3 style="margin-top:0">Backup</h3><p class="hint">Os dados ficam salvos só neste navegador. Exporte o backup com frequência e envie para o sócio importar no aparelho dele.</p>
 <div class="row"><button class="gh" onclick="bk()">Baixar backup</button><label style="max-width:260px">Restaurar backup<input type="file" accept=".json" onchange="rs(this)"></label><button class="gh" onclick="if(confirm('Apagar tudo?')){S=JSON.parse(JSON.stringify(def));save();render()}">Apagar tudo</button></div></div>`;
 $('#c_modo').value=c.modo||'ambos'}

 document.querySelectorAll('[data-c]').forEach(i=>c.canais[i.dataset.c][i.dataset.k]=+i.value||0);save();toast('Ajustes salvos.');render()}
async function dl(nome,data){try{const d=window.claude&&await claude.use('downloads');if(!d){const a=document.createElement('a');a.href=URL.createObjectURL(data instanceof Blob?data:new Blob([data]));a.download=nome;a.click();return}await d.save({filename:nome,data})}catch(e){if(!e||e.code!=='declined')toast('Não foi possível salvar o arquivo.')}}
const bk=()=>dl('backup-tallow-'+hoje()+'.json',JSON.stringify(S),'application/json');
function rs(i){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{S=JSON.parse(r.result);mig();save();toast('Backup restaurado.');render()}catch(e){toast('Arquivo inválido.')}};r.readAsText(f)}
function pdf(){
 const L=lista().slice().sort((a,b)=>a.data.localeCompare(b.data)||a.id-b.id);if(!L.length){toast('Não há vendas no período selecionado.');return}
 if(!window.jspdf){toast('A biblioteca de PDF não carregou. Verifique a conexão e recarregue.');return}
 const t=tot(),A=S.cfg.nomeA,B=S.cfg.nomeB,{jsPDF}=window.jspdf,d=new jsPDF({unit:'pt',format:'a4'}),W=d.internal.pageSize.getWidth(),m=36,r=x=>R(x).replace(/\s/g,' '),fd=x=>x.split('-').reverse().join('/');
 let liq=0;L.forEach(v=>liq+=calc(v).liq);
 d.setFillColor(13,13,13);d.rect(0,0,W,96,'F');d.setFillColor(212,168,75);d.rect(0,96,W,4,'F');
 try{const c=document.createElement('canvas');c.width=c.height=200;const x=c.getContext('2d');x.fillStyle='#f6f1e7';x.beginPath();x.arc(100,100,100,0,7);x.fill();x.drawImage($('.lg'),0,0,200,200);d.addImage(c.toDataURL('image/png'),'PNG',m,16,64,64)}catch(e){}
 d.setTextColor(228,189,106);d.setFont('helvetica','bold');d.setFontSize(26);d.text('BOVUN',m+80,48);
 d.setFont('helvetica','normal');d.setFontSize(10);d.setTextColor(240,217,176);d.text('Tallow bovino purificado',m+80,64);
 d.setFont('helvetica','bold');d.setFontSize(15);d.setTextColor(255,255,255);d.text('Relatório de vendas',W-m,42,{align:'right'});
 d.setFont('helvetica','normal');d.setFontSize(10);d.text('Período: '+(filtro?filtro.split('-').reverse().join('/'):'todo o período'),W-m,58,{align:'right'});d.text('Emitido em '+fd(hoje()),W-m,72,{align:'right'});
 const bx=[['Vendido (bruto)',r(t.bruto),[40,30,20]],['Vendido (líquido)',r(liq),[40,30,20]],['Comissão de '+A,r(t.comA),[47,107,79]],['Comissão de '+B,r(t.comB),[154,74,43]]],bw=(W-2*m-24)/4;
 bx.forEach((b,i)=>{const x=m+i*(bw+8);d.setFillColor(250,246,236);d.setDrawColor(227,217,198);d.roundedRect(x,118,bw,54,5,5,'FD');d.setFillColor(...b[2]);d.rect(x,118,4,54,'F');d.setFont('helvetica','normal');d.setFontSize(8.5);d.setTextColor(122,108,90);d.text(b[0],x+12,135);d.setFont('helvetica','bold');d.setFontSize(12.5);d.setTextColor(...b[2]);d.text(b[1],x+12,158)});
 d.autoTable({startY:190,theme:'grid',margin:{left:m,right:m,bottom:46},styles:{fontSize:8.5,cellPadding:5,lineColor:[227,217,198],textColor:[42,33,24]},headStyles:{fillColor:[13,13,13],textColor:[228,189,106]},footStyles:{fillColor:[13,13,13],textColor:[228,189,106]},alternateRowStyles:{fillColor:[250,246,236]},showFoot:'lastPage',
  head:[['Data','Produto','Qtd','Canal','Bruto','Líquido',A,B]],

  foot:[['Total','',t.qtd,'',r(t.bruto),r(liq),r(t.comA),r(t.comB)]],
  columnStyles:{2:{halign:'center'},4:{halign:'right'},5:{halign:'right'},6:{halign:'right'},7:{halign:'right'}},
  didDrawPage:q=>{d.setFont('helvetica','normal');d.setFontSize(8);d.setTextColor(122,108,90);d.text('BOVUN · Tallow bovino purificado',m,d.internal.pageSize.getHeight()-24);d.text('Página '+q.pageNumber,W-m,d.internal.pageSize.getHeight()-24,{align:'right'})}});
 const y=d.lastAutoTable.finalY+14;d.setFontSize(8.5);d.setTextColor(122,108,90);d.text('Líquido = valor bruto menos taxas da plataforma, tarifas fixas e frete. As comissões seguem o valor fixo por produto cadastrado.',m,Math.min(y,d.internal.pageSize.getHeight()-44));
 dl('relatorio-vendas-bovun'+(filtro?'-'+filtro:'')+'.pdf',d.output('blob'))}

 const l=lista().map(v=>{const c=calc(v);return[v.data,v.vend==='A'?S.cfg.nomeA:S.cfg.nomeB,v.canal,v.prod,v.qtd,c.bruto,c.taxas,c.custo,c.lucro,c.cA,v.pA?'Sim':'Nao',c.cB,v.pB?'Sim':'Nao'].map(f).join(';')});

const AUTH='49fafebeb3e4cef4a4a39ae2399e354e558200699472efc82395028f709373ff';
const sha=async t=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t)))].map(b=>b.toString(16).padStart(2,'0')).join('');
const sess=()=>{try{return localStorage.getItem('bv_s')==='1'||sessionStorage.getItem('bv_s')==='1'}catch(e){return false}};
$('#lg .llogo').src=$('.lg').src;
async function login(){const u=$('#lu').value.trim().toLowerCase(),p=$('#lp').value;let ok=false;
 try{ok=await sha(u+':'+p)===AUTH}catch(e){}
 if(ok){try{($('#lm').checked?localStorage:sessionStorage).setItem('bv_s','1')}catch(e){}$('#le').textContent='';$('#lg').classList.add('out');setTimeout(()=>{document.body.classList.add('in');render()},650)}
 else{const b=$('.lbox');$('#le').textContent='Usuário ou senha incorretos.';b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');$('#lp').value='';$('#lp').focus()}}
$('#lb').onclick=login;['lu','lp'].forEach(i=>$('#'+i).addEventListener('keydown',e=>{if(e.key==='Enter')login()}));
$('#lv').onclick=()=>{const p=$('#lp');p.type=p.type==='password'?'text':'password'};

if(sess())document.body.classList.add('in');
(function(){const c=$('#cv'),x=c.getContext('2d');let w,h;const P=[],rs=()=>{w=c.width=innerWidth;h=c.height=innerHeight};addEventListener('resize',rs);rs();
 const N=matchMedia('(prefers-reduced-motion:reduce)').matches?0:55;for(let i=0;i<N;i++)P.push({x:Math.random()*w,y:Math.random()*h,r:Math.random()*2.2+.6,v:Math.random()*.5+.15,a:Math.random()*6.28,o:Math.random()*.55+.2});
 (function f(){if(!document.body.classList.contains('in')){x.clearRect(0,0,w,h);x.shadowBlur=8;x.shadowColor='#e4bd6a';P.forEach(p=>{p.y-=p.v;p.x+=Math.sin(p.a+=.01)*.3;if(p.y<-5){p.y=h+5;p.x=Math.random()*w}x.beginPath();x.arc(p.x,p.y,p.r,0,7);x.fillStyle='rgba(228,189,106,'+p.o+')';x.fill()})}requestAnimationFrame(f)})()})();
